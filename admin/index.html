<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>暉盈官網後台</title>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  <script>
    // 登入改用密碼（/auth），把按鈕上的「GitHub」字樣換掉，避免誤會
    new MutationObserver(function () {
      document.querySelectorAll("button").forEach(function (b) {
        if (/GitHub/.test(b.textContent) && !b.dataset.relabeled) {
          b.dataset.relabeled = "1";
          b.lastChild.textContent = "用密碼登入";
        }
      });
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
