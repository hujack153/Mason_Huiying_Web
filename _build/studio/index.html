<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>暉盈官網編輯工作台</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/studio.js" defer></script>
</head>
<body>
  <header class="mast">
    <div>
      <span class="eyebrow">HUIYING MATERIALS · 本機工作台</span>
      <h1>官網內容管理</h1>
    </div>
    <div class="actions">
      <button id="reset" type="button" disabled>重設草稿</button>
      <button id="save" type="button" class="primary" disabled>儲存草稿</button>
      <button id="export" type="button" disabled>匯出審核檔</button>
    </div>
  </header>
  <main>
    <div class="status" id="status" role="status">正在載入本機內容…</div>
    <nav aria-label="工作區" class="tabs">
      <button id="page-tab" type="button" aria-pressed="true" aria-controls="page-workspace">編輯頁面</button>
      <button id="catalog-tab" type="button" aria-pressed="false" aria-controls="catalog-workspace">產品管理</button>
    </nav>
    <section id="page-workspace" aria-labelledby="page-heading">
      <div class="bar">
        <div><h2 id="page-heading">首頁</h2><p>點選預覽中的主標或引言，就能修改文字。</p></div>
        <div class="actions">
          <label>語言
            <select id="page-language"><option value="zh">中文</option><option value="en">English</option></select>
          </label>
          <label>預覽寬度
            <select id="viewport"><option value="desktop">桌機</option><option value="mobile">手機</option></select>
          </label>
        </div>
      </div>
      <div class="editor-layout">
        <div class="frame-wrap"><iframe id="home-preview" title="官網首頁預覽" sandbox="allow-same-origin"></iframe></div>
        <aside class="editor-panel" aria-labelledby="text-heading">
          <h3 id="text-heading">編輯文字</h3>
          <label for="home-field">選擇欄位</label>
          <select id="home-field"><option value="h1">首頁主標</option><option value="lead">首頁引言</option></select>
          <label for="home-text" id="home-label">首頁主標</label>
          <textarea id="home-text" rows="6" maxlength="6000"></textarea>
          <p id="home-hint">主標可以換行。修改會即時反映在預覽。</p>
        </aside>
      </div>
    </section>
    <section id="catalog-workspace" aria-labelledby="catalog-heading" hidden>
      <div class="bar">
        <div><h2 id="catalog-heading">防水材料系列</h2><p>中英文一起管理。下架後可隨時恢復。</p></div>
        <div class="actions">
          <button id="preview-catalog" type="button">預覽產品頁</button>
          <button id="add-product" class="primary" type="button">新增系列</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">系列</th><th scope="col">語言</th><th scope="col">狀態</th><th scope="col">操作</th></tr></thead>
          <tbody id="products"></tbody>
        </table>
      </div>
      <section id="catalog-preview-panel" hidden aria-labelledby="catalog-preview-heading">
        <div class="bar">
          <h3 id="catalog-preview-heading">產品頁預覽</h3>
          <label>語言
            <select id="catalog-language"><option value="zh">中文</option><option value="en">English</option></select>
          </label>
        </div>
        <div class="frame-wrap"><iframe id="catalog-preview" title="防水材料頁預覽" sandbox="allow-same-origin"></iframe></div>
      </section>
    </section>
  </main>
  <dialog id="product-dialog" aria-labelledby="product-heading">
    <form id="product-form">
      <div class="bar">
        <h2 id="product-heading">編輯系列</h2>
        <button id="close-product" type="button">取消</button>
      </div>
      <label>系列代號 <input id="product-id" maxlength="64" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></label>
      <p class="hint" id="id-help">用英文小寫、數字或連字號，儲存到清單後固定。</p>
      <label>語言 <select id="product-language"><option value="zh">中文</option><option value="en">English</option></select></label>
      <div id="product-fields"></div>
      <p class="hint">名稱、小標、說明和適用部位需填寫中英文，才可匯出上架內容。</p>
      <p id="product-error" role="alert"></p>
      <button class="primary" type="submit">更新清單</button>
    </form>
  </dialog>
</body>
</html>
